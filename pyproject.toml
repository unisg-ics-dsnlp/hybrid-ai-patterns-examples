[project]
name = "hybrid-ai-patterns"
version = "0.1.0"
description = "Hello-world examples for the ten Hybrid AI patterns (FrameX + LLM via OpenRouter)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/framex", "src/llm.py", "src/world.py"]
sources = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
